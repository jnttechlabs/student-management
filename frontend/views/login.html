<div class="card mx-auto" style="max-width:400px"><div class="card-body">
  <h4>Login</h4>
  <form ng-submit="vm.login()">
    <input class="form-control mb-2" type="email" placeholder="Email" ng-model="vm.creds.email" required>
    <input class="form-control mb-2" type="password" placeholder="Password" ng-model="vm.creds.password" required>
    <div class="text-danger mb-2" ng-if="vm.error">{{vm.error}}</div>
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <a href="#!/register" class="d-block mt-2">New user? Register</a>
</div></div>
